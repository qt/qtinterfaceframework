qmlplugin:
    module:
        documents:
            - "plugin.cpp": "plugin.cpp.jinja"
            - "{{srcBase|lower}}.pri": "module.pri.jinja"
            - '{{srcBase|lower}}.cmake': 'CMakeLists.txt.jinja'
            - "plugins.qmltypes": "common/plugins.qmltypes.jinja"
            - "designer/{{module.module_name|lower}}.metainfo": "common/designer.metainfo.jinja"
            - "qmldir": "qmldir_plugin.jinja"
            - "qml/{{module|qml_type|replace('.', '/')}}/plugins.qmltypes": "common/plugins.qmltypes.jinja"
            - "qml/{{module|qml_type|replace('.', '/')}}/designer/{{module.module_name|lower}}.metainfo": "common/designer.metainfo.jinja"
            - "qml/{{module|qml_type|replace('.', '/')}}/qmldir": "qmldir_plugin.jinja"
