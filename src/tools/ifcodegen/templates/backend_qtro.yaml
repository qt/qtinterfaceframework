backend_qtro:
    module:
        documents:
            - "{{module.module_name|lower}}roplugin.h": "plugin.h.jinja"
            - "{{module.module_name|lower}}roplugin.cpp": "plugin.cpp.jinja"
            - "{{module.module_name|lower}}.json": "plugin.json.jinja"
            - "{{srcBase|lower}}.pri": "plugin.pri.jinja"
            - '{{srcBase|lower}}.cmake': 'CMakeLists.txt.jinja'
    interface:
        documents:
            - '{{interface|lower}}robackend.h': 'backend.h.jinja'
            - '{{interface|lower}}robackend.cpp': 'backend.cpp.jinja'
            - "{{interface|lower}}.rep": "common/interface.rep.jinja"
