backend_dbus:
    module:
        documents:
            - "{{module.module_name|lower}}dbusplugin.h": "plugin.h.jinja"
            - "{{module.module_name|lower}}dbusplugin.cpp": "plugin.cpp.jinja"
            - "{{module.module_name|lower}}.json": "plugin.json.jinja"
            - "{{srcBase|lower}}.pri": "plugin.pri.jinja"
            - '{{srcBase|lower}}.cmake': 'CMakeLists.txt.jinja'
    interface:
        documents:
            - '{{interface|lower}}dbusbackend.h': 'backend.h.jinja'
            - '{{interface|lower}}dbusbackend.cpp': 'backend.cpp.jinja'
